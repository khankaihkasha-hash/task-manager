services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
      POSTGRES_DB: tasks
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks"]
      interval: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://tasks:tasks@db:5432/tasks
      SECRET_KEY: change-me-in-production
      ADMIN_EMAIL: admin@example.com
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
